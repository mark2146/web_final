<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{% url 'home' %}">大學牲了沒</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">主頁</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">登入</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'register' %}">註冊</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'evaluation_form' %}">提交評價</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'evaluation_list' %}">查看評價</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'course_bot' %}">搶課機器人</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'resume_generator' %}">履歷生成器</a>
                </li>
            </ul>
        </div>
    </nav>
<div class="container mt-5">
    <h2 class="text-center mb-4">登入帳號</h2>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        
        <!-- 顯示錯誤或成功消息 -->
        {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- 用戶名輸入 -->
        <div class="form-group">
            <label for="username">用戶名</label>
            <input 
                type="text" 
                class="form-control" 
                id="username" 
                name="username" 
                placeholder="輸入用戶名" 
                value="{{ request.POST.username|default_if_none:'' }}" 
                required>
        </div>

        <!-- 密碼輸入 -->
        <div class="form-group">
            <label for="password">密碼</label>
            <input 
                type="password" 
                class="form-control" 
                id="password" 
                name="password" 
                placeholder="輸入密碼" 
                required>
        </div>

        <!-- 登錄按鈕 -->
        <button type="submit" class="btn btn-primary btn-block">登入</button>

        <!-- 註冊連結 -->
        <div class="text-center mt-3">
            <a href="{% url 'register' %}" class="btn btn-link">還沒有帳號？立即註冊</a>
        </div>
    </form>
</div>
</body>
</html>
